---
configuration:
  beam_size:
    name: Ширина претраге
    description: >-
      Број кандидата који се истовремено разматрају током транскрипције (0 =
      аутоматски). Повећање ове вредности повећава тачност на рачун
      перформанси.
  language:
    name: Језик
    description: >-
      Језик за који се модел унапред учитава приликом покретања.
  model:
    name: Модел
    description: |
      Whisper модел који ће се користити за транскрипцију.

      Подразумевана опција `auto` бира `tiny-int8` за ARM уређаје као што је Raspberry
      Pi 4, односно `base-int8` за остале уређаје. Компримовани модели (`int8`) су нешто
      мање прецизни од стандардних верзија, али су мањи и бржи.
  custom_model:
    name: Прилагођени модел
    description: |
      Путања до директоријума са конвертованим моделом или ID Whisper модела
      конвертованог за CTranslate2 са HuggingFace Hub-а, као што је
      "Systran/faster-distil-whisper-small.en".

      Ако је `custom_model_type` подешен на 'transformers', може се користити
      ID HuggingFace transformers Whisper модела са HuggingFace-а, као што је
      'openai/whisper-tiny.en'.
  custom_model_type:
    name: Тип прилагођеног модела
    description: |
      Позадински систем за претварање говора у текст (STT) који се користи за `custom_model` ако је `stt_library` подешен
      на аутоматски (`auto`).
  initial_prompt:
    name: Почетни упит
    description: >-
      Опис звука који може помоћи моделу Whisper да боље транскрибује
      неуобичајене речи.
  stt_library:
    name: Библиотека за говор у текст
    description: >-
      Позадинска библиотека за претварање говора у текст која ће се користити.

      Подразумевана опција `auto` бира најбољу библиотеку/модел на основу
      језика и хардвера.

      Замењује се опцијом `custom_model_type` када је `custom_model` подешен.
  whisper_task:
    name: Задатак модела Whisper
    description: >-
      Задатак који модел треба да изврши.

      Подразумевана опција `transcribe` записује звук на језику на којем се говори, док
      `translate` преводи изговорени звук на енглески језик.
  sherpa_streaming:
    name: Sherpa стриминг
    description: >-
      Користи стриминг модел са sherpa позадинским системом.

      Ово замењује подразумевани енглески модел бржим, али мање прецизним
      стриминг моделом.
  vad_clip:
    name: VAD исецање тишине
    description: >-
      Користи детекцију гласовне активности (VAD) за исецање тишине из звука пре
      транскрипције.

      Ово значајно смањује кашњење код снимака са много тишине, посебно код пакетних
      система као што су sherpa и funasr. Не утиче на стриминг системе.
  local_files_only:
    name: Само локалне датотеке
    description: >-
      Користи само моделе који су већ преузети и никада не проверава ажурирања
      на мрежи.

      Оставите ову опцију искључену док се модели не преузму, а затим је укључите како би
      додатак остао ван мреже и прескакао проверу ажурирања при сваком захтеву.
  debug_logging:
    name: Евиденција за отклањање грешака
    description: >-
      Уписује поруке DEBUG нивоа у евиденцију апликације.
network:
  10300/tcp: Whisper Wyoming протокол
